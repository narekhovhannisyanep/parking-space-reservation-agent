[project]
name = "parking-space-reservation-agent"
version = "0.1.0"
description = "Parking space reservation agent project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["A", "B", "C4", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty]
environment.python = ".venv"
