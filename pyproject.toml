[project]
name = "parking-space-reservation-agent"
version = "0.1.0"
description = "Parking space reservation agent project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "langsmith>=0.14.11",
    "notebook>=7.6.3",
    "python-dotenv>=1.2.4",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-include = ["*.ipynb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
extend-select = ["BLE001"]
unfixable = ["F401"]

[tool.ty]
environment.python = ".venv"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.38",
    "langgraph[inmem]>=1.2.16",
]
